name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: bash -n proxmox-enable-sensors.sh run.sh

      - name: shellcheck
        run: shellcheck -S warning proxmox-enable-sensors.sh run.sh

      - name: perl -c nos scripts embutidos
        run: |
          awk '/<<.COLLECTEOF.$/{f=1;next} /^COLLECTEOF$/{f=0} f'           proxmox-enable-sensors.sh > /tmp/collect.pl
          awk '/patch-pm.pl" <<.PERLEOF.$/{f=1;next} /^PERLEOF$/{f=0} f'    proxmox-enable-sensors.sh > /tmp/patch-pm.pl
          awk '/patch-js.pl" <<.PERLEOF.$/{f=1;next} /^PERLEOF$/{f=0} f'    proxmox-enable-sensors.sh > /tmp/patch-js.pl
          for f in /tmp/collect.pl /tmp/patch-pm.pl /tmp/patch-js.pl; do
            test -s "$f" && perl -c "$f"
          done
