name: release

# Publishes the .deb when a vX.Y.Z tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# A manual run (workflow_dispatch) only builds the .deb as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint and test
        run: |
          make lint
          sudo env "PATH=$PATH" make test

      - name: Build the package
        id: build
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            DEB="$(packaging/build-deb.sh "$GITHUB_REF_NAME")"
          else
            DEB="$(packaging/build-deb.sh)"
          fi
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          # fixed name for the .../releases/latest/download/pve-sensors_all.deb link
          cp "$DEB" dist/pve-sensors_all.deb
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pve-sensors-deb
          path: dist/*.deb

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.build.outputs.deb }}" dist/pve-sensors_all.deb \
            --title "$GITHUB_REF_NAME" --generate-notes
